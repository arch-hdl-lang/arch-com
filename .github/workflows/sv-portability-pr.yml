name: sv-portability

# PR-gate SV portability check — Verilator only (arch#813 P3, arch#812).
#
# WHY THIS EXISTS SEPARATELY FROM nightly-portability.yml
#
# `nightly-portability.yml` runs the same sweep across *both* frontends
# (Icarus + Verilator) once a day. That tier is the right home for the full
# multi-frontend matrix: iverilog is the slower, more version-sensitive tool,
# and a nightly cadence keeps its version drift out of the merge path.
#
# But nightly means a portability regression is found up to 24 hours *after*
# it merges. Every fix in the #650 -> #807 -> #810 -> #845 -> #846 -> #852 ->
# #861 chain emitted SystemVerilog that no CI job compiled at merge time; each
# one was caught by hand, days or weeks later. This job closes that window for
# the cheaper half of the matrix: Verilator alone would have caught #810's
# size-cast form (`8'(x)[hi:lo]`), the `8'hff[s +: 2]` literal case found in
# #813 P1, and #861's emitted shape — all pre-merge.
#
# WHY VERILATOR ONLY
#
# Verilator installs from apt in seconds and is the project's primary
# simulator. Icarus adds real coverage (it is stricter about select
# composition — the whole #807/#810 family is Icarus-only) but is left to the
# nightly tier deliberately, to keep this check fast and to avoid a
# tool-version bump blocking merges. The sweep script degrades gracefully:
# a frontend whose binary is absent is recorded `SKIPPED` for every design and
# is excluded from the baseline diff, so running it Verilator-only needs no
# script flag and cannot produce false failures for the missing frontend.
#
# WHY NOT A JOB IN test.yml
#
# `test.yml` is the required PR gate and documents a deliberate policy of
# installing no external SV frontends. That policy is sound for the required
# check; this job is kept separate so it can be adopted into branch protection
# on its own terms rather than by amending a check that intentionally has no
# external tool dependencies.
#
# COST
#
# The sweep runs a deterministic `.archi` prepass before measuring (see the
# script), which roughly 5x's its runtime: ~5 min locally at -j 8, so
# expect ~10-15 min on a shared runner. That is the price of a verdict that
# does not depend on build order — without it the same corpus scored
# differently at -j 8 and -j 4, which would make this gate flap. If that
# wall-clock is judged too expensive for the merge path, the honest
# alternative is to drop back to nightly-only rather than to remove the
# prepass.
#
# WHAT IT DOES NOT CATCH
#
# The sweep is a parse/elaborate check over the *existing* corpus. It cannot
# catch a wrong-values miscompile (#861 was one — the bad SV compiled cleanly
# on Verilator and simply computed something else), and it only ever sees
# expression shapes some fixture already contains. Neither limitation is
# fixable by tier or by frontend count; see arch#813 for the coverage-matrix
# discussion.

on:
  pull_request:
    paths:
      # Anything that can change emitted SV, plus the sweep's own inputs.
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'scripts/sv_portability_sweep.sh'
      - '.github/workflows/sv-portability-pr.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch: {}

concurrency:
  group: sv-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portability-verilator:
    name: SV portability (Verilator)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sv-portability-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sv-portability-cargo-${{ runner.os }}-

      - name: Install Verilator (apt)
        id: apt_verilator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq verilator
          echo "version=$(verilator --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Check Verilator version
        id: verilator_check
        run: |
          # Same 5.034 floor as nightly-equivalence.yml / nightly-portability.yml,
          # for the same reason: ARCH's generated reset loops use non-blocking
          # assignment to arrays inside for-loops, which older 5.x builds reject
          # (%Error-BLKLOOPINIT) — that would show up here as a corpus-wide wall
          # of false regressions, not a subtle skew.
          ver="${{ steps.apt_verilator.outputs.version }}"
          major="${ver%%.*}"
          minor="${ver#*.}"; minor="${minor%%[^0-9]*}"
          major=$((10#${major:-0})); minor=$((10#${minor:-0}))
          echo "apt-provided Verilator: $ver"
          if [ "$major" -gt 5 ] || { [ "$major" -eq 5 ] && [ "$minor" -ge 34 ]; }; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache built Verilator (fallback)
        if: steps.verilator_check.outputs.ok != 'true'
        id: cache_verilator_build
        uses: actions/cache@v4
        with:
          path: /opt/verilator-built
          key: verilator-build-v5.034-${{ runner.os }}

      - name: Build Verilator from source (fallback)
        if: steps.verilator_check.outputs.ok != 'true' && steps.cache_verilator_build.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq git make autoconf g++ flex bison ccache \
            help2man libgoogle-perftools-dev numactl perl-doc libfl2 libfl-dev \
            zlib1g zlib1g-dev
          git clone --depth 1 --branch v5.034 https://github.com/verilator/verilator /tmp/verilator-src
          cd /tmp/verilator-src
          autoconf
          ./configure --prefix=/opt/verilator-built
          make -j"$(nproc)"
          sudo make install PREFIX=/opt/verilator-built

      - name: Use fallback Verilator on PATH (fallback)
        if: steps.verilator_check.outputs.ok != 'true'
        run: echo "/opt/verilator-built/bin" >> "$GITHUB_PATH"

      - name: Tool version (final)
        run: verilator --version

      - name: Build arch (release)
        run: cargo build --release

      - name: Run Verilator portability sweep
        id: sweep
        run: |
          mkdir -p /tmp/arch-portability-sweep
          # No iverilog is installed on this runner, so every Icarus row is
          # recorded SKIPPED and excluded from the baseline diff — only the
          # Verilator half of tests/portability_baseline.tsv gates here.
          if scripts/sv_portability_sweep.sh -j "$(nproc)" \
               --out-dir /tmp/arch-portability-sweep \
               target/release/arch tests examples; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=drift" >> "$GITHUB_OUTPUT"
          fi

      - name: Write job summary
        if: always()
        run: |
          {
            echo "# SV portability (Verilator) — PR gate"
            echo ""
            echo "Verilator: \`$(verilator --version)\`"
            echo ""
            if [ "${{ steps.sweep.outputs.status }}" = "clean" ]; then
              echo "No Verilator drift vs \`tests/portability_baseline.tsv\`."
            else
              echo "**Drift detected** vs \`tests/portability_baseline.tsv\`."
              echo ""
              echo "- **REGRESSION** (\`OK -> FAIL/BUILD_FAIL\`): this branch emits SystemVerilog"
              echo "  Verilator no longer accepts. Fix it here — do not re-bless."
              echo "- **CHANGED**: the failure reason moved; check it is not a new defect."
              echo "- **IMPROVEMENT** (\`FAIL -> OK\`): a fix landed. Review the diff, then"
              echo "  re-bless locally with both frontends installed:"
              echo "  \`scripts/sv_portability_sweep.sh --bless target/release/arch tests examples\`"
              echo ""
              echo "Icarus rows are \`SKIPPED\` here by design — the full matrix runs in"
              echo "\`nightly-portability.yml\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sweep logs on drift
        if: failure() || steps.sweep.outputs.status != 'clean'
        uses: actions/upload-artifact@v4
        with:
          name: sv-portability-pr-logs
          path: /tmp/arch-portability-sweep/
          retention-days: 7

      - name: Fail if drift detected
        if: steps.sweep.outputs.status != 'clean'
        run: exit 1
