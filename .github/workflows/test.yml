name: test

# The main correctness gate: builds the compiler and runs the full `cargo
# test` suite. Runs on every PR and every push to main (no path filter) so it
# can be safely wired up as a required status check — a path-filtered
# workflow never reports on PRs outside its filter, which would leave a
# required check permanently pending on e.g. docs-only PRs.
#
# Dependency policy: the runner does NOT install verilator, iverilog, z3, the
# Lean/lake toolchain, or pybind11. Every test that shells out to one of
# those tools already skip-cleanly (eprintln + early return) when the tool is
# absent from PATH — see tests/common/mod.rs and the `skipping: ... not
# found` guards throughout tests/integration_test.rs and tests/fp_test.rs.
# This matches the existing convention in examples.yml, which also runs
# `cargo test --release` without installing any of those tools. Leaving them
# uninstalled keeps the gate fast and avoids new flakiness from pinning
# distro-packaged versions of large external tools; it trades away some
# coverage (Verilator/iverilog parity legs, z3 differential/SMT proofs, Lean
# proof-replay tests) that already runs on contributor/agent machines with
# those tools installed. If reviewers want that coverage in CI, it belongs in
# a slower opt-in/nightly tier, not this PR gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-tools:
    name: MCP tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r mcp/requirements.txt
      - run: python -m unittest discover -s mcp -p 'test_*.py'
      - run: python -m unittest discover -s tools -p 'test_codegraph_eval.py'
      - run: python -m unittest discover -s tools -p 'test_compiler_context.py'
      - run: python -m unittest discover -s tools -p 'test_compiler_response.py'
      - run: python -m unittest discover -s tools -p 'test_compiler_search.py'
      - run: python -m unittest discover -s tools -p 'test_compiler_selection.py'
      - run: python -m unittest discover -s tools -p 'test_compiler_selector_profile.py'
      - run: python -m unittest discover -s tools -p 'test_compiler_recovery.py'

  fp-synth-replay:
    name: FP synth replay guard
    runs-on: ubuntu-latest
    # Solver-free regression guard for the published SymbiYosys pipeline
    # cross-check harness (tests/fp_v1/synth/crosscheck_sby_pipeline.py). These
    # checks bind the archived design fingerprint, reject corrupt fixtures and
    # mutation-site drift, require a bounded counterexample for every mutation,
    # and assemble the full generation matrix (every fixture x baseline+6 faults
    # x profile). They import the runner and read the committed gzipped fixtures
    # only — no Yosys, SBY, Verilator, z3 or Lean — so they belong in this fast
    # PR gate; the solver-bound proof replay itself stays in the opt-in/nightly
    # tier per this file's dependency policy above.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/fp_v1/synth -p 'test_sby_pipeline_replay.py'

  cargo-test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-

      - name: cargo build --release
        run: cargo build --release

      - name: code graph direct retrieval audit
        run: python3 tools/codegraph_direct_eval.py --arch-bin target/release/arch

      - name: compiler context preflight audit
        run: python3 tools/codegraph_direct_eval.py --compiler-context --arch-bin target/release/arch

      - name: Install compiler recovery search dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Compiler ownership and recovery regressions
        env:
          ARCH_COMPILER_GRAPH_BIN: target/release/arch
        run: python3 -m unittest discover -s tools -p 'test_compiler_ownership_integration.py'

      - name: cargo test --release
        run: cargo test --release
